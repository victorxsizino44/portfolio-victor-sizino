name: Portfolio CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
          clean: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: Pin npm
        timeout-minutes: 3
        run: |
          npm install --global npm@11.13.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v24.16.0'
          test "$(npm --version)" = '11.13.0'
      - name: Install from lockfile
        timeout-minutes: 8
        run: npm ci --no-audit --no-fund
      - name: Verify dependency tree
        timeout-minutes: 2
        run: npm ls --all
      - name: Lint
        timeout-minutes: 5
        run: npm run lint
      - name: Typecheck
        timeout-minutes: 5
        run: npm run typecheck
      - name: Tests
        timeout-minutes: 5
        run: npm test
      - name: Production build
        timeout-minutes: 10
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
          clean: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: Pin npm
        timeout-minutes: 3
        run: |
          npm install --global npm@11.13.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v24.16.0'
          test "$(npm --version)" = '11.13.0'
      - name: Install from lockfile
        id: install
        timeout-minutes: 8
        run: npm ci --no-audit --no-fund
      # Exceptions are DRAFT / NOT EFFECTIVE: preserve the original exit code.
      - name: Full dependency audit
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/lot14-audit"
          set +e
          npm audit --json > "$RUNNER_TEMP/lot14-audit/full.json" 2> "$RUNNER_TEMP/lot14-audit/full.stderr.log"
          audit_status=$?
          set -e
          printf '%s\n' "$audit_status" > "$RUNNER_TEMP/lot14-audit/full.exit-code.txt"
          cat "$RUNNER_TEMP/lot14-audit/full.json"
          exit "$audit_status"
      - name: Runtime dependency audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/lot14-audit"
          set +e
          npm audit --omit=dev --json > "$RUNNER_TEMP/lot14-audit/runtime.json" 2> "$RUNNER_TEMP/lot14-audit/runtime.stderr.log"
          audit_status=$?
          set -e
          printf '%s\n' "$audit_status" > "$RUNNER_TEMP/lot14-audit/runtime.exit-code.txt"
          cat "$RUNNER_TEMP/lot14-audit/runtime.json"
          exit "$audit_status"
      - name: Preserve audit evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lot14-audit/
          retention-days: 14
          if-no-files-found: error
